<div class="product-form-page">
  <header class="page-header">
    <a routerLink="/dashboard/products" class="back-link"><span class="material-symbols-outlined">arrow_back</span> Voltar</a>
    <h2 class="page-title">{{ isEditMode ? 'Editar Produto' : 'Novo Produto' }}</h2>
  </header>
  <div *ngIf="loading" class="loading-state"><div class="skeleton" style="height:500px"></div></div>
  <div *ngIf="successMessage" class="success-msg"><span class="material-symbols-outlined">check_circle</span> {{ successMessage }}</div>
  <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="onSubmit()" class="product-form">
    <div class="form-grid">
      <div class="form-card">
        <h3 class="form-section-title">Informações do Produto</h3>
        <div class="form-group">
          <label class="form-label">Nome *</label>
          <input type="text" class="form-input" formControlName="name" placeholder="Nome do produto" />
        </div>
        <div class="form-group">
          <label class="form-label">Descrição *</label>
          <textarea class="form-input" formControlName="description" placeholder="Descrição detalhada" rows="4" style="resize:vertical"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Preço *</label>
            <input type="number" class="form-input" formControlName="price" placeholder="0.00" min="0" step="0.01" />
          </div>
          <div class="form-group">
            <label class="form-label">Preço com Desconto</label>
            <input type="number" class="form-input" formControlName="discountPrice" placeholder="0.00" min="0" step="0.01" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Estoque *</label>
            <input type="number" class="form-input" formControlName="stock" placeholder="0" min="0" />
          </div>
          <div class="form-group">
            <label class="form-label">Categoria</label>
            <input type="text" class="form-input" formControlName="category" placeholder="Ex: Vestuário" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">URL da Imagem Principal</label>
          <input type="url" class="form-input" formControlName="imageUrl" placeholder="https://..." />
        </div>
      </div>
      <div class="form-side">
        <div class="form-card" *ngIf="form.get('imageUrl')?.value">
          <h3 class="form-section-title">Preview</h3>
          <img [src]="form.get('imageUrl')?.value" alt="Preview" class="preview-img" />
        </div>
        <div class="form-card">
          <h3 class="form-section-title">Configurações</h3>
          <div class="toggle-item">
            <div><p class="toggle-label">Ativo</p><p class="toggle-sub">Visível na loja</p></div>
            <label class="switch"><input type="checkbox" formControlName="active" /><span class="slider"></span></label>
          </div>
          <div class="toggle-item">
            <div><p class="toggle-label">Novidade</p><p class="toggle-sub">Badge 'Novo'</p></div>
            <label class="switch"><input type="checkbox" formControlName="isNew" /><span class="slider"></span></label>
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="errorMessage" class="error-msg"><span class="material-symbols-outlined">error</span> {{ errorMessage }}</div>
    <div class="form-actions">
      <a routerLink="/dashboard/products" class="btn btn-outline">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="submitting">
        <span *ngIf="submitting" class="material-symbols-outlined spinning">progress_activity</span>
        {{ isEditMode ? 'Salvar' : 'Criar Produto' }}
      </button>
    </div>
  </form>
</div>
