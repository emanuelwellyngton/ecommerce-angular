<nav class="site-header" [class.mobile-open]="mobileMenuOpen">
  <div class="header-inner">
    <!-- Mobile Menu Button -->
    <button class="menu-btn" (click)="toggleMobileMenu()" aria-label="Menu">
      <span class="material-symbols-outlined">{{ mobileMenuOpen ? 'close' : 'menu' }}</span>
    </button>

    <!-- Brand Logo -->
    <a class="brand" routerLink="/site" (click)="closeMobileMenu()">LUXE</a>

    <!-- Desktop Navigation -->
    <ul class="desktop-nav" aria-label="Navegação principal">
      <li>
        <a routerLink="/site/products" routerLinkActive="active" class="nav-link">
          Coleções
        </a>
      </li>
      <li>
        <a routerLink="/site/products" [queryParams]="{isNew: true}" class="nav-link">
          Novidades
        </a>
      </li>
      <li>
        <a routerLink="/site/products" class="nav-link">
          Ofertas
        </a>
      </li>
      <li>
        <a routerLink="/site/about" routerLinkActive="active" class="nav-link">
          Sobre
        </a>
      </li>
    </ul>

    <!-- Actions -->
    <div class="header-actions">
      <a routerLink="/site/products" class="icon-btn" aria-label="Buscar">
        <span class="material-symbols-outlined">search</span>
      </a>

      <a routerLink="/site/cart" class="icon-btn cart-btn" aria-label="Carrinho">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>

      <button class="icon-btn desktop-only" (click)="goToAccount()" aria-label="Conta">
        <span class="material-symbols-outlined">person</span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="mobileMenuOpen">
    <ul class="mobile-nav">
      <li><a routerLink="/site/products" (click)="closeMobileMenu()" class="mobile-nav-link">Coleções</a></li>
      <li><a routerLink="/site/products" (click)="closeMobileMenu()" class="mobile-nav-link">Novidades</a></li>
      <li><a routerLink="/site/products" (click)="closeMobileMenu()" class="mobile-nav-link">Ofertas</a></li>
      <li><a routerLink="/site/about" (click)="closeMobileMenu()" class="mobile-nav-link">Sobre</a></li>
      <li><a routerLink="/site/faq" (click)="closeMobileMenu()" class="mobile-nav-link">FAQ</a></li>
      <li>
        <a *ngIf="isAuthenticated" routerLink="/site/account" (click)="closeMobileMenu()" class="mobile-nav-link">Minha Conta</a>
        <a *ngIf="!isAuthenticated" routerLink="/site/login" (click)="closeMobileMenu()" class="mobile-nav-link">Entrar</a>
      </li>
    </ul>
  </div>
</nav>
