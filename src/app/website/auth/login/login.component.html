<main class="auth-page">
  <div class="auth-container">
    <!-- Form Side -->
    <div class="auth-form-side">
      <div class="auth-form-inner">
        <!-- Header -->
        <div class="auth-header">
          <h1 class="auth-title">Bem-vindo de volta</h1>
          <p class="auth-subtitle">Entre na sua conta para continuar</p>
        </div>

        <!-- Error -->
        <div *ngIf="errorMessage" class="auth-error">
          <span class="material-symbols-outlined">error</span>
          {{ errorMessage }}
        </div>

        <!-- Form -->
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="username">Usuário ou E-mail</label>
            <input
              id="username"
              type="text"
              class="form-input"
              [class.error]="form.get('username')?.invalid && form.get('username')?.touched"
              formControlName="username"
              placeholder="Seu nome de usuário"
              autocomplete="username"
            />
            <span *ngIf="form.get('username')?.invalid && form.get('username')?.touched" class="field-error">
              Usuário é obrigatório
            </span>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Senha</label>
            <div class="input-with-toggle">
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                class="form-input"
                [class.error]="form.get('password')?.invalid && form.get('password')?.touched"
                formControlName="password"
                placeholder="Sua senha"
                autocomplete="current-password"
              />
              <button type="button" class="password-toggle" (click)="showPassword = !showPassword">
                <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
              </button>
            </div>
            <span *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="field-error">
              Senha deve ter no mínimo 6 caracteres
            </span>
          </div>

          <div class="forgot-link-row">
            <a routerLink="/site/forgot-password" class="forgot-link">Esqueci minha senha</a>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-full" [disabled]="loading">
            <span *ngIf="loading" class="material-symbols-outlined spinning">progress_activity</span>
            <span *ngIf="!loading">Entrar</span>
          </button>
        </form>

        <p class="auth-switch">
          Não tem uma conta?
          <a routerLink="/site/register" class="auth-switch-link">Cadastre-se</a>
        </p>
      </div>
    </div>

    <!-- Image Side -->
    <div class="auth-image-side">
      <div class="auth-image" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDb9lsCrtB-xctjMJwFkZ1GnaK9SDfrntCDbJV789CavqjMKXH_WbfKUG-H73JXhntkeOvqZbxWHJzN9TP5QJk1JygmMcxF77FErrVfsWi0zlFsUeRcJPDPC9pyopz0coS0d2we6-LGAYKWZux_2UBcaKQ0nL4PZDc_aK0DWptCVOczgH7Ft9WWxIjSOzo6Qp8fU6QTUlPfe8areCverdW_UPozxrzuvrGeQG-O7EVpGmaxm8997tkUN5JuoOz6ZLiZKMIxhwR8NKI');">
        <div class="auth-image-overlay">
          <div class="auth-image-content">
            <span class="auth-badge">Coleção de Outono</span>
            <h2 class="auth-image-title">Minimalismo Redefinido.</h2>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
